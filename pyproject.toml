[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumora-ai"
version = "0.1.0"
description = "LumoraAI - Make every model smarter, cheaper, and easier to control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ubaid Ullah", email = "ubaidawan244@gmail.com" }]
keywords = ["llm", "openai", "openrouter", "ollama", "cache", "router", "ai", "cost-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
lumora = "lumora.cli:app"

[project.urls]
Homepage = "https://github.com/uaahacker/lumora-ai"
Issues = "https://github.com/uaahacker/lumora-ai/issues"

[tool.setuptools.packages.find]
include = ["lumora*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
